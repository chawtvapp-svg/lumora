<!DOCTYPE html>
<html lang="ckb" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#070B1A">
<title>Lumora</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Lumora">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent;user-select:none}
html,body{height:100%;overflow:hidden;background:#070B1A;touch-action:none}
body{font-family:'Vazirmatn',system-ui,sans-serif;color:#EEF1FB}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
.hud{position:fixed;top:calc(env(safe-area-inset-top) + 14px);left:0;right:0;display:flex;justify-content:space-between;padding:0 20px;pointer-events:none;font-weight:800;font-size:18px;opacity:.9}
.hud b{color:#7CF3D0}
#ov{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center;padding:24px;background:radial-gradient(circle,rgba(7,11,26,.55),rgba(7,11,26,.9))}
#ov h1{font-size:38px;font-weight:800;letter-spacing:0}
#ov p{color:#9AA6C8;line-height:1.9;max-width:300px}
#ov button{margin-top:10px;background:linear-gradient(135deg,#7B61FF,#31E0A8);color:#07101F;border:0;border-radius:99px;padding:14px 44px;font:inherit;font-weight:800;font-size:18px}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="hud"><span>خاڵ <b id="sc">0</b></span><span>باشترین <b id="hs">0</b></span></div>
<div id="ov"><h1 id="t" style="direction:ltr">Lumora</h1><p id="p">دەوری ئەستێرەیەک دەگەڕێیت. لە کاتی گونجاودا پەنجە بنێ تا بازبدەیت بۆ ئەوی تر. نەکەوە ناو تاریکی.</p><button id="go">دەستپێبکە</button></div>

<script>
const cv = document.getElementById("c"), ctx = cv.getContext("2d");
const LW = 400;                     // پانی جیهانی یاری
let W, H, s, LH, dpr;
function resize(){
  dpr = Math.min(devicePixelRatio || 1, 2);
  W = innerWidth; H = innerHeight;
  cv.width = W * dpr; cv.height = H * dpr;
  s = W / LW; LH = H / s;
}
addEventListener("resize", resize); resize();

const rnd = (a, b) => a + Math.random() * (b - a);
let best = 0;
try { best = +localStorage.getItem("orbitBest") || 0; } catch {}
document.getElementById("hs").textContent = best;

let P, planets, stars, parts, trail, bg, camY, score, last, running = false, over = false, shake = 0;

function newPlanet(y, x){
  return { x: x ?? rnd(80, LW - 80), y, r: rnd(13, 24), hue: rnd(170, 290), cap: 0, pulse: 0 };
}
function reset(){
  planets = [newPlanet(0, LW/2)];
  planets[0].r = 20;
  P = { x: LW/2 + 46, y: 0, vx: 0, vy: 0, on: planets[0], a: 0, dir: 1, R: 46, free: 0, skip: null, skipT: 0 };
  stars = []; parts = []; trail = []; score = 0; camY = -LH * 0.65; shake = 0;
  bg = Array.from({length: 90}, () => ({ x: rnd(0, LW), y: rnd(0, 800), z: rnd(.2, .9), r: rnd(.5, 1.6) }));
  document.getElementById("sc").textContent = 0;
  extend();
}
function extend(){
  let L = planets[planets.length - 1];
  while (L.y > camY - LH * 1.3){
    const n = newPlanet(L.y - rnd(120, 175));
    stars.push({ x: (L.x + n.x)/2 + rnd(-20, 20), y: (L.y + n.y)/2, got: false });
    planets.push(n); L = n;
  }
  while (planets.length > 14 && planets[0].y > camY + LH + 300) planets.shift();
}
function burst(x, y, hue, n){
  for (let i = 0; i < n; i++){
    const a = rnd(0, 6.283), v = rnd(30, 150);
    parts.push({ x, y, vx: Math.cos(a)*v, vy: Math.sin(a)*v, life: 1, hue });
  }
}
function release(){
  if (!P.on || over) return;
  const rx = P.x - P.on.x, ry = P.y - P.on.y, d = Math.hypot(rx, ry);
  const tx = -ry / d * P.dir, ty = rx / d * P.dir;
  P.vx = tx * 330; P.vy = ty * 330;
  P.skip = P.on; P.skipT = .4; P.on = null;
  burst(P.x, P.y, 170, 6);
}

function update(dt){
  if (P.skipT > 0) P.skipT -= dt;
  if (P.on){
    const pl = P.on, target = pl.r + 26;
    P.R += (target - P.R) * Math.min(1, dt * 8);
    P.a += P.dir * (190 / P.R) * dt;
    P.x = pl.x + Math.cos(P.a) * P.R;
    P.y = pl.y + Math.sin(P.a) * P.R;
    pl.pulse = Math.max(0, pl.pulse - dt * 2);
  } else {
    P.x += P.vx * dt; P.y += P.vy * dt;
    for (const pl of planets){
      if (pl === P.skip && P.skipT > 0) continue;
      const dx = P.x - pl.x, dy = P.y - pl.y, d = Math.hypot(dx, dy);
      if (d < pl.r + 52){
        P.on = pl; P.R = d; P.a = Math.atan2(dy, dx);
        P.dir = (dx * P.vy - dy * P.vx) >= 0 ? 1 : -1;
        pl.pulse = 1; shake = 5;
        if (!pl.cap){ pl.cap = 1; score++; document.getElementById("sc").textContent = score; }
        burst(P.x, P.y, pl.hue, 16);
        break;
      }
    }
  }
  trail.push({ x: P.x, y: P.y }); if (trail.length > 26) trail.shift();

  for (const st of stars){
    if (!st.got && Math.hypot(P.x - st.x, P.y - st.y) < 18){
      st.got = true; score++; document.getElementById("sc").textContent = score; burst(st.x, st.y, 55, 14);
    }
  }
  for (const p of parts){ p.x += p.vx*dt; p.y += p.vy*dt; p.vx *= .96; p.vy *= .96; p.life -= dt * 1.4; }
  parts = parts.filter(p => p.life > 0);

  const ty = P.y - LH * 0.65;
  if (ty < camY) camY += (ty - camY) * Math.min(1, dt * 4);
  shake *= .88;
  extend();
  if (!P.on && (P.y - camY > LH + 30 || P.x < -60 || P.x > LW + 60)) end();
}

function glow(x, y, r, color, a){
  const g = ctx.createRadialGradient(x, y, 0, x, y, r);
  g.addColorStop(0, `hsla(${color},${a})`); g.addColorStop(1, `hsla(${color},0)`);
  ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x, y, r, 0, 6.283); ctx.fill();
}

function draw(){
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, "#0B1030"); g.addColorStop(1, "#070B1A");
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);

  const sx = shake ? rnd(-shake, shake) : 0, sy = shake ? rnd(-shake, shake) : 0;
  ctx.setTransform(dpr * s, 0, 0, dpr * s, sx * dpr, sy * dpr);

  // ئەستێرەی پاشبنەما (پارالاکس)
  ctx.fillStyle = "#fff";
  for (const b of bg){
    const y = ((b.y - camY * b.z * .35) % (LH + 40) + LH + 40) % (LH + 40) - 20;
    ctx.globalAlpha = .25 + b.z * .5; ctx.beginPath(); ctx.arc(b.x, y, b.r, 0, 6.283); ctx.fill();
  }
  ctx.globalAlpha = 1;
  ctx.translate(0, -camY);
  ctx.globalCompositeOperation = "lighter";

  for (const pl of planets){
    glow(pl.x, pl.y, pl.r * 4.2 + pl.pulse * 24, `${pl.hue},90%,60%`, .22 + pl.pulse * .3);
    ctx.strokeStyle = `hsla(${pl.hue},80%,70%,${.14 + pl.pulse * .3})`; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.arc(pl.x, pl.y, pl.r + 26, 0, 6.283); ctx.stroke();
  }
  ctx.globalCompositeOperation = "source-over";
  for (const pl of planets){
    const gr = ctx.createRadialGradient(pl.x - pl.r*.35, pl.y - pl.r*.35, 1, pl.x, pl.y, pl.r);
    gr.addColorStop(0, `hsl(${pl.hue},85%,78%)`); gr.addColorStop(1, `hsl(${pl.hue},70%,32%)`);
    ctx.fillStyle = gr; ctx.beginPath(); ctx.arc(pl.x, pl.y, pl.r, 0, 6.283); ctx.fill();
  }

  ctx.globalCompositeOperation = "lighter";
  for (const st of stars){
    if (st.got) continue;
    const t = performance.now() / 300;
    glow(st.x, st.y, 14 + Math.sin(t + st.y) * 2, "50,100%,60%", .55);
    ctx.fillStyle = "#FFE98A"; ctx.beginPath(); ctx.arc(st.x, st.y, 3.2, 0, 6.283); ctx.fill();
  }
  for (let i = 0; i < trail.length; i++){
    const k = i / trail.length;
    glow(trail[i].x, trail[i].y, 3 + k * 7, "165,95%,62%", k * .5);
  }
  for (const p of parts) glow(p.x, p.y, 5, `${p.hue},95%,65%`, p.life * .8);
  glow(P.x, P.y, 20, "165,95%,70%", .8);
  ctx.fillStyle = "#fff"; ctx.beginPath(); ctx.arc(P.x, P.y, 4.6, 0, 6.283); ctx.fill();
  ctx.globalCompositeOperation = "source-over";
}

function frame(t){
  requestAnimationFrame(frame);
  const dt = Math.min(.033, (t - last) / 1000 || .016); last = t;
  if (running) update(dt);
  draw();
}
function end(){
  over = true; running = false;
  if (score > best){ best = score; document.getElementById("hs").textContent = best; try { localStorage.setItem("orbitBest", best); } catch {} }
  document.getElementById("t").textContent = "تاریکی قووتی دایت";
  document.getElementById("t").style.direction = "rtl";
  document.getElementById("p").textContent = "خاڵەکانت: " + score;
  document.getElementById("go").textContent = "دووبارە";
  document.getElementById("ov").style.display = "flex";
}
document.getElementById("go").onclick = e => {
  e.stopPropagation();
  reset(); over = false; running = true;
  document.getElementById("ov").style.display = "none";
};
addEventListener("pointerdown", e => { if (running && e.target === cv || running) release(); });
addEventListener("keydown", e => { if (e.code === "Space") { e.preventDefault(); if (running) release(); } });

if("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(()=>{});
reset(); requestAnimationFrame(t => { last = t; frame(t); });
</script>
</body>
</html>
