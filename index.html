<!DOCTYPE html>
<html lang="ckb" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#070B1A">
<title>Lumora</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Lumora">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent;user-select:none}
html{background:#070B1A}html,body{height:100%;overflow:hidden;touch-action:none}
body{font-family:'Vazirmatn',system-ui,sans-serif;color:#EEF1FB}
canvas{position:fixed;left:0;top:0;width:100%;height:100%;display:block}
.hud{position:fixed;top:calc(env(safe-area-inset-top) + 14px);left:0;right:0;display:flex;justify-content:space-between;padding:0 20px;pointer-events:none;font-weight:800;font-size:18px;opacity:.9}
.hud b{color:#7CF3D0}
#pw{font-size:16px;direction:ltr}
#tx{position:fixed;top:28%;left:0;right:0;text-align:center;font-weight:800;font-size:26px;color:#7CF3D0;opacity:0;transition:opacity .3s;pointer-events:none;text-shadow:0 0 16px rgba(124,243,208,.6)}
#ov{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;padding:24px;background:radial-gradient(circle,rgba(7,11,26,.5),rgba(7,11,26,.88))}
#ov h1{font-size:38px;font-weight:800}
#ov p{color:#9AA6C8;line-height:1.8;max-width:300px;font-size:14px}
#ov button{margin-top:6px;background:linear-gradient(135deg,#7B61FF,#31E0A8);color:#07101F;border:0;border-radius:99px;padding:14px 44px;font:inherit;font-weight:800;font-size:18px}
#ov button.mini{background:rgba(255,255,255,.1);color:#cfd6f0;padding:8px 20px;font-size:14px;margin-top:0}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:center;max-width:340px}
.row small{color:#9AA6C8;font-size:12px;width:100%}
.sw{width:36px;height:36px;border-radius:50%;border:2px solid transparent;display:flex;align-items:center;justify-content:center;font-size:18px;color:#fff;text-shadow:0 0 6px #000}
.sw.on{border-color:#fff;box-shadow:0 0 14px rgba(255,255,255,.45)}
.sw.bg{border-radius:10px}
</style>
<script>
(function(){
  const c=document.createElement("canvas");c.width=c.height=180;const x=c.getContext("2d");
  const g=x.createLinearGradient(0,0,0,180);g.addColorStop(0,"#0E143A");g.addColorStop(1,"#050816");
  x.fillStyle=g;x.fillRect(0,0,180,180);
  function gl(px,py,r,col,a){const q=x.createRadialGradient(px,py,0,px,py,r);q.addColorStop(0,col.replace("A",a));q.addColorStop(1,col.replace("A",0));x.fillStyle=q;x.beginPath();x.arc(px,py,r,0,7);x.fill();}
  gl(55,45,120,"rgba(123,97,255,A)",.5);gl(135,150,100,"rgba(49,224,168,A)",.25);
  x.strokeStyle="rgba(160,190,255,.4)";x.lineWidth=1.5;x.beginPath();x.arc(90,90,53,0,7);x.stroke();
  gl(90,90,60,"rgba(140,110,255,A)",.5);
  const p=x.createRadialGradient(78,80,2,90,90,24);p.addColorStop(0,"#C8B4FF");p.addColorStop(1,"#4628AA");
  x.fillStyle=p;x.beginPath();x.arc(90,90,24,0,7);x.fill();
  const a0=-.95;
  for(let i=0;i<40;i++){const k=i/40,a=a0-(1-k)*.9;gl(90+53*Math.cos(a),90+53*Math.sin(a),2+k*7,"rgba(49,224,168,A)",k*k*.7);}
  const bx=90+53*Math.cos(a0),by=90+53*Math.sin(a0);
  gl(bx,by,26,"rgba(49,224,168,A)",.9);x.fillStyle="#fff";x.beginPath();x.arc(bx,by,4,0,7);x.fill();
  const u=c.toDataURL("image/png");
  ["apple-touch-icon","icon"].forEach(r=>{const l=document.createElement("link");l.rel=r;l.href=u;document.head.appendChild(l);});
})();
</script>
</head>
<body>
<canvas id="c"></canvas>
<div class="hud"><span>خاڵ <b id="sc">0</b></span><span id="pw"></span><span>باشترین <b id="hs">0</b></span></div>
<div id="tx"></div>
<div id="ov"><h1 id="t" style="direction:ltr">Lumora</h1><p id="p">دەوری ئەستێرەیەک دەگەڕێیت. لە کاتی گونجاودا پەنجە بنێ تا بازبدەیت بۆ ئەوی تر. نەکەوە ناو تاریکی و دوور بکەوە لە کونی ڕەش.</p>
<div class="row"><small>باگراوەند</small><span id="gk" class="row"></span></div>
<div class="row"><small>جۆری تۆپ</small><span id="bk" class="row"></span></div>
<div class="row"><small>ڕەنگی تۆپ</small><span id="sk" class="row"></span></div>
<button id="go">دەستپێبکە</button><button id="snd" class="mini"></button></div>

<script>
const cv = document.getElementById("c"), ctx = cv.getContext("2d");
const LW = 400;
let W, H, s, LH, dpr, ready = false;
/* پڕکردنەوەی تەواوی شاشە، بەبێ بۆشایی */
const probe = document.createElement("div");
probe.style.cssText = "position:fixed;left:0;top:0;right:0;bottom:0;visibility:hidden;pointer-events:none";
document.body.appendChild(probe);
const EX = 220;
let DH;
function resize(){
  dpr = Math.min(devicePixelRatio || 1, 2);
  const r = probe.getBoundingClientRect(), vv = window.visualViewport;
  const w = Math.round(r.width) || innerWidth;
  let h = Math.max(Math.round(r.height), innerHeight, vv ? Math.round(vv.height) : 0);
  if (navigator.standalone && innerHeight > innerWidth) h = Math.max(h, screen.height);
  document.documentElement.style.height = document.body.style.height = (h + EX) + "px";
  W = w; H = h + EX;
  cv.style.cssText = "position:fixed;left:0;top:0;display:block;width:" + W + "px;height:" + H + "px";
  cv.width = W * dpr; cv.height = H * dpr;
  s = W / LW; LH = h / s; DH = H / s;
  if (ready && !running){ camY = -LH * .65; extend(); }
}
addEventListener("resize", resize); addEventListener("orientationchange", resize);
if (window.visualViewport) visualViewport.addEventListener("resize", resize);
resize(); setTimeout(resize, 150); setTimeout(resize, 600);

const rnd = (a, b) => a + Math.random() * (b - a);
const $ = id => document.getElementById(id);
const ld = (k, d) => { try { const v = localStorage.getItem(k); return v === null ? d : +v; } catch { return d; } };
const sv = (k, v) => { try { localStorage.setItem(k, v); } catch {} };
let best = ld("orbitBest", 0), skin = ld("lumSkin", 0), ball = ld("lumBall", 0), bgSel = ld("lumBg", 0), muted = ld("lumMute", 0) === 1;
if (skin > 4) skin = 0;
$("hs").textContent = best;

/* ---------- worlds / backgrounds ---------- */
const WORLDS = [
  { n: "نەبیۆلا", a: [11,16,48], b: [7,11,26], h: [200,290], root: 196 },
  { n: "ئۆرۆرا", a: [8,38,42], b: [5,16,24], h: [120,190], root: 174.6 },
  { n: "ئاگر", a: [48,16,28], b: [24,8,16], h: [0,50], root: 164.8 },
  { n: "زەریا", a: [6,24,60], b: [4,10,32], h: [190,240], root: 220 },
  { n: "گوڵ", a: [66,20,60], b: [30,8,36], h: [290,350], root: 196 },
  { n: "دارستان", a: [10,44,22], b: [4,20,12], h: [90,150], root: 196 },
  { n: "ڕەش", a: [10,10,12], b: [0,0,0], h: [0,360], root: 196 },
  { n: "ئاسمان", a: [30,60,110], b: [10,22,58], h: [170,220], root: 196 }
];
const wi = () => bgSel > 0 ? bgSel - 1 : Math.floor(score / 12) % 4;
let cA = WORLDS[0].a.slice(), cB = WORLDS[0].b.slice(), curW = 0;

/* ---------- skins / balls ---------- */
const SK = [165, 320, 45, 210, -1];
const ph = () => skin === 4 ? (performance.now() / 12) % 360 : SK[skin];
const BALLS = ["●", "◆", "★", "♥", "◎", "▲"];
function mk(box, n, cur, fn, style, txt){
  box.innerHTML = "";
  for (let i = 0; i < n; i++){
    const d = document.createElement("div");
    d.className = "sw" + (i === cur ? " on" : "") + (style(i).cls || "");
    d.style.background = style(i).bg || "rgba(255,255,255,.12)";
    d.textContent = txt ? txt(i) : "";
    d.onclick = e => { e.stopPropagation(); fn(i); drawPick(); };
    box.appendChild(d);
  }
}
function drawPick(){
  mk($("sk"), SK.length, skin, i => { skin = i; sv("lumSkin", i); },
    i => ({ bg: SK[i] < 0 ? "conic-gradient(#f66,#fd6,#6f9,#6bf,#c6f,#f66)" : `hsl(${SK[i]},90%,62%)` }));
  mk($("bk"), BALLS.length, ball, i => { ball = i; sv("lumBall", i); },
    () => ({}), i => BALLS[i]);
  mk($("gk"), WORLDS.length + 1, bgSel, i => { bgSel = i; sv("lumBg", i); reset(); },
    i => i === 0 ? { cls: " bg", bg: "conic-gradient(#7B61FF,#31E0A8,#ff8a5c,#4aa3ff,#7B61FF)" }
      : { cls: " bg", bg: `linear-gradient(rgb(${WORLDS[i-1].a}),rgb(${WORLDS[i-1].b}))` },
    i => i === 0 ? "∞" : "");
}
function drawSnd(){ $("snd").textContent = muted ? "🔇 دەنگ داخراوە" : "🔊 دەنگ کراوەیە"; }
$("snd").onclick = e => {
  e.stopPropagation(); muted = !muted; if (mg) mg.gain.value = muted ? 0 : 1;
  sv("lumMute", muted ? 1 : 0); drawSnd();
};

/* ---------- state ---------- */
let P, planets, stars, items, wells, parts, trail, bg, camY, score, last, running = false, over = false, shake = 0, nm = 0, ts = 1, tT;

function toast(t){
  const e = $("tx"); e.textContent = t; e.style.opacity = 1;
  clearTimeout(tT); tT = setTimeout(() => e.style.opacity = 0, 1100);
}
function newPlanet(y, x){
  const h = WORLDS[wi()].h;
  return { x: x ?? rnd(80, LW - 80), y, r: rnd(13, 24), hue: rnd(h[0], h[1]), cap: 0, pulse: 0 };
}
function reset(){
  score = 0; curW = wi(); cA = WORLDS[curW].a.slice(); cB = WORLDS[curW].b.slice(); nm = 0; ts = 1;
  planets = [newPlanet(0, LW/2)];
  planets[0].r = 20;
  P = { x: LW/2 + 46, y: 0, vx: 0, vy: 0, on: planets[0], a: 0, dir: 1, R: 46, skip: null, skipT: 0,
        shield: false, mag: 0, slow: 0, last: planets[0], md: new Map(), nmd: new Set() };
  stars = []; items = []; wells = []; parts = []; trail = []; camY = -LH * 0.65; shake = 0;
  bg = Array.from({length: 90}, () => ({ x: rnd(0, LW), y: rnd(0, 800), z: rnd(.2, .9), r: rnd(.5, 1.6) }));
  $("sc").textContent = 0; $("pw").textContent = "";
  extend();
}
function extend(){
  let L = planets[planets.length - 1];
  while (L.y > camY - LH * 1.3){
    const n = newPlanet(L.y - rnd(120, 175));
    const mx = (L.x + n.x) / 2, my = (L.y + n.y) / 2;
    stars.push({ x: mx + rnd(-20, 20), y: my, got: false });
    if (score >= 3 && Math.random() < .22){
      const k = rnd(.25, .4);
      items.push({ t: "SMT"[Math.floor(rnd(0, 3))], x: L.x + (n.x - L.x) * k + rnd(-18, 18), y: L.y + (n.y - L.y) * k, got: false });
    }
    if (score >= 5 && Math.random() < .28){
      const sx = Math.random() < .5 ? -1 : 1;
      wells.push({ x: Math.max(30, Math.min(LW - 30, mx + sx * 88)), y: my + rnd(-15, 15), dead: false });
    }
    planets.push(n); L = n;
  }
  while (planets.length > 14 && planets[0].y > camY + LH + 300) planets.shift();
  while (stars.length > 40 && stars[0].y > camY + LH + 200) stars.shift();
  while (items.length > 12 && items[0].y > camY + LH + 200) items.shift();
  while (wells.length > 12 && wells[0].y > camY + LH + 200) wells.shift();
}
function burst(x, y, hue, n){
  for (let i = 0; i < n; i++){
    const a = rnd(0, 6.283), v = rnd(30, 150);
    parts.push({ x, y, vx: Math.cos(a)*v, vy: Math.sin(a)*v, life: 1, hue });
  }
}
function release(){
  if (!P.on || over) return;
  const rx = P.x - P.on.x, ry = P.y - P.on.y, d = Math.hypot(rx, ry);
  const tx = -ry / d * P.dir, ty = rx / d * P.dir;
  P.vx = tx * 330; P.vy = ty * 330;
  P.last = P.on; P.skip = P.on; P.skipT = .4; P.on = null;
  P.md = new Map(); P.nmd = new Set();
  burst(P.x, P.y, ph(), 6);
}

/* ---------- audio (تەنها دەنگی بەرکەوتن) ---------- */
let ac = null, mg = null;
let sil = null;
function silentWav(){
  const n = 4410, b = new DataView(new ArrayBuffer(44 + n * 2)), w = (o, t) => [...t].forEach((c, i) => b.setUint8(o + i, c.charCodeAt(0)));
  w(0, "RIFF"); b.setUint32(4, 36 + n * 2, true); w(8, "WAVEfmt "); b.setUint32(16, 16, true); b.setUint16(20, 1, true); b.setUint16(22, 1, true);
  b.setUint32(24, 44100, true); b.setUint32(28, 88200, true); b.setUint16(32, 2, true); b.setUint16(34, 16, true); w(36, "data"); b.setUint32(40, n * 2, true);
  return URL.createObjectURL(new Blob([b], { type: "audio/wav" }));
}
function unlock(){
  try {
    if (navigator.audioSession) navigator.audioSession.type = "playback";
    if (!sil){ sil = new Audio(silentWav()); sil.loop = true; sil.volume = .01; sil.play().catch(() => {}); }
    if (!ac){ ac = new (window.AudioContext || window.webkitAudioContext)(); mg = ac.createGain(); mg.gain.value = muted ? 0 : 1; mg.connect(ac.destination); }
    if (ac.state !== "running") ac.resume();
  } catch {}
}
["touchend", "click", "pointerdown"].forEach(e => addEventListener(e, unlock, { passive: true }));
function tone(f, type, v, att, dur, f2){
  if (!ac || muted) return;
  if (ac.state !== "running") ac.resume();
  const t = ac.currentTime, o = ac.createOscillator(), g = ac.createGain();
  o.type = type; o.frequency.setValueAtTime(f, t);
  if (f2) o.frequency.exponentialRampToValueAtTime(f2, t + dur);
  g.gain.setValueAtTime(.0001, t);
  g.gain.exponentialRampToValueAtTime(v, t + att);
  g.gain.exponentialRampToValueAtTime(.0001, t + dur);
  o.connect(g); g.connect(mg); o.start(t); o.stop(t + dur + .05);
}
const PENT = [0, 2, 4, 7, 9];
function chime(){
  const n = score, f = 392 * Math.pow(2, (PENT[n % 5] + 12 * Math.floor((n % 15) / 5)) / 12);
  tone(f, "sine", .3, .01, .5); tone(f * 2, "triangle", .1, .01, .5); tone(130, "sine", .35, .005, .16, 55);
}

/* ---------- logic ---------- */
function hit(reason){
  if (P.shield){
    P.shield = false; burst(P.x, P.y, 200, 24); shake = 6;
    if (reason === "well"){ P.vx *= -1; P.vy *= -1; return; }
    P.on = P.last; P.R = P.last.r + 26; P.a = -1.57; P.skipT = 0;
    toast("قەڵغان ڕزگاری کردیت!"); return;
  }
  tone(180, "sawtooth", .2, .01, .6, 60);
  end(reason === "well" ? "کونی ڕەش قووتی دایت" : "تاریکی قووتی دایت");
}
function update(dt0){
  const tgt = Math.min(nm > 0 ? .3 : 1, P.slow > 0 ? .55 : 1);
  ts += (tgt - ts) * Math.min(1, dt0 * 10);
  const dt = dt0 * ts;
  nm = Math.max(0, nm - dt0);
  if (P.slow > 0) P.slow -= dt0;
  if (P.mag > 0) P.mag -= dt0;
  if (P.skipT > 0) P.skipT -= dt;
  if (P.on){
    const pl = P.on, target = pl.r + 26;
    P.R += (target - P.R) * Math.min(1, dt * 8);
    P.a += P.dir * (190 / P.R) * dt;
    P.x = pl.x + Math.cos(P.a) * P.R;
    P.y = pl.y + Math.sin(P.a) * P.R;
    pl.pulse = Math.max(0, pl.pulse - dt * 2);
  } else {
    for (const w of wells){
      if (w.dead) continue;
      const dx = w.x - P.x, dy = w.y - P.y, d = Math.hypot(dx, dy);
      if (d < 130){ const a = (1 - d / 130) * 520; P.vx += dx / d * a * dt; P.vy += dy / d * a * dt; }
      if (d < 12){ w.dead = true; hit("well"); }
    }
    P.x += P.vx * dt; P.y += P.vy * dt;
    for (const pl of planets){
      if (pl === P.skip && P.skipT > 0) continue;
      const dx = P.x - pl.x, dy = P.y - pl.y, d = Math.hypot(dx, dy);
      if (d < pl.r + 52){
        P.on = pl; P.R = d; P.a = Math.atan2(dy, dx);
        P.dir = (dx * P.vy - dy * P.vx) >= 0 ? 1 : -1;
        pl.pulse = 1; shake = 5;
        if (!pl.cap){ pl.cap = 1; score++; $("sc").textContent = score; }
        burst(P.x, P.y, pl.hue, 16); chime();
        break;
      }
      const m = P.md.get(pl);
      if (m === undefined || d < m) P.md.set(pl, d);
      else if (d > m + 3 && !P.nmd.has(pl) && m >= pl.r + 52 && m < pl.r + 80){
        P.nmd.add(pl); nm = .6; pl.pulse = 1; toast("نزیک بوو!");
      }
    }
  }
  trail.push({ x: P.x, y: P.y }); if (trail.length > 26) trail.shift();

  const pull = (o, spd) => { if (P.mag > 0){ const d = Math.hypot(P.x - o.x, P.y - o.y); if (d < 110 && d > 1){ o.x += (P.x - o.x) / d * spd * dt; o.y += (P.y - o.y) / d * spd * dt; } } };
  for (const st of stars){
    if (st.got) continue; pull(st, 260);
    if (Math.hypot(P.x - st.x, P.y - st.y) < 18){
      st.got = true; score++; $("sc").textContent = score; burst(st.x, st.y, 55, 14);
      tone(1318, "sine", .2, .01, .3);
    }
  }
  for (const it of items){
    if (it.got) continue; pull(it, 260);
    if (Math.hypot(P.x - it.x, P.y - it.y) < 20){
      it.got = true; burst(it.x, it.y, 190, 18);
      tone(1046, "sine", .2, .01, .3); tone(1568, "sine", .16, .08, .4);
      if (it.t === "S"){ P.shield = true; toast("🛡 قەڵغان"); }
      else if (it.t === "M"){ P.mag = 8; toast("🧲 موگناتیس"); }
      else { P.slow = 6; toast("⏳ کاتی هێواش"); }
    }
  }
  for (const p of parts){ p.x += p.vx*dt; p.y += p.vy*dt; p.vx *= .96; p.vy *= .96; p.life -= dt * 1.4; }
  parts = parts.filter(p => p.life > 0);

  const w = wi();
  if (w !== curW){ curW = w; if (bgSel === 0) toast(WORLDS[w].n); }
  $("pw").textContent = (P.shield ? "🛡 " : "") + (P.mag > 0 ? "🧲" + Math.ceil(P.mag) + " " : "") + (P.slow > 0 ? "⏳" + Math.ceil(P.slow) : "");

  const ty = P.y - LH * 0.65;
  if (ty < camY) camY += (ty - camY) * Math.min(1, dt * 4);
  shake *= .88;
  extend();
  if (!P.on && (P.y - camY > LH + 30 || P.x < -60 || P.x > LW + 60)) hit("fall");
}

/* ---------- drawing ---------- */
function glow(x, y, r, color, a){
  const g = ctx.createRadialGradient(x, y, 0, x, y, r);
  g.addColorStop(0, `hsla(${color},${a})`); g.addColorStop(1, `hsla(${color},0)`);
  ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x, y, r, 0, 6.283); ctx.fill();
}
function shape(t, x, y, r, now){
  ctx.save(); ctx.translate(x, y);
  if (t !== 3) ctx.rotate(now / 600);
  ctx.beginPath();
  if (t === 0) ctx.arc(0, 0, r, 0, 6.283);
  else if (t === 1){ ctx.moveTo(0, -r * 1.5); ctx.lineTo(r * 1.1, 0); ctx.lineTo(0, r * 1.5); ctx.lineTo(-r * 1.1, 0); ctx.closePath(); }
  else if (t === 2){ for (let i = 0; i < 10; i++){ const a = -1.5708 + i * .6283, q = i % 2 ? r * .55 : r * 1.5; ctx.lineTo(Math.cos(a) * q, Math.sin(a) * q); } ctx.closePath(); }
  else if (t === 3){ ctx.moveTo(0, r * .9); ctx.bezierCurveTo(-r * 2, -r * .3, -r * .8, -r * 1.6, 0, -r * .5); ctx.bezierCurveTo(r * .8, -r * 1.6, r * 2, -r * .3, 0, r * .9); }
  else if (t === 4){ ctx.arc(0, 0, r * 1.1, 0, 6.283); ctx.strokeStyle = "#fff"; ctx.lineWidth = 2.2; ctx.stroke(); ctx.restore(); return; }
  else { ctx.moveTo(0, -r * 1.4); ctx.lineTo(r * 1.3, r); ctx.lineTo(-r * 1.3, r); ctx.closePath(); }
  ctx.fillStyle = "#fff"; ctx.fill(); ctx.restore();
}
function draw(){
  const W2 = WORLDS[curW];
  for (let i = 0; i < 3; i++){ cA[i] += (W2.a[i] - cA[i]) * .04; cB[i] += (W2.b[i] - cB[i]) * .04; }
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  const g = ctx.createLinearGradient(0, 0, 0, H - EX);
  g.addColorStop(0, `rgb(${cA.map(Math.round)})`); g.addColorStop(1, `rgb(${cB.map(Math.round)})`);
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  const bgc = `rgb(${cB.map(Math.round)})`;
  if (bgc !== draw.last){ draw.last = bgc; document.documentElement.style.backgroundColor = bgc; document.body.style.backgroundColor = bgc; }

  const sx = shake ? rnd(-shake, shake) : 0, sy = shake ? rnd(-shake, shake) : 0;
  ctx.setTransform(dpr * s, 0, 0, dpr * s, sx * dpr, sy * dpr);

  ctx.fillStyle = "#fff";
  for (const b of bg){
    const y = ((b.y - camY * b.z * .35) % (DH + 40) + DH + 40) % (DH + 40) - 20;
    ctx.globalAlpha = .25 + b.z * .5; ctx.beginPath(); ctx.arc(b.x, y, b.r, 0, 6.283); ctx.fill();
  }
  ctx.globalAlpha = 1;
  ctx.translate(0, -camY);
  const now = performance.now(), ph0 = ph();
  ctx.globalCompositeOperation = "lighter";

  for (const pl of planets){
    glow(pl.x, pl.y, pl.r * 4.2 + pl.pulse * 24, `${pl.hue},90%,60%`, .22 + pl.pulse * .3);
    ctx.strokeStyle = `hsla(${pl.hue},80%,70%,${.14 + pl.pulse * .3})`; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.arc(pl.x, pl.y, pl.r + 26 + pl.pulse * 10, 0, 6.283); ctx.stroke();
  }
  for (const w of wells) if (!w.dead) glow(w.x, w.y, 70, "275,90%,55%", .3);
  ctx.globalCompositeOperation = "source-over";
  for (const pl of planets){
    const gr = ctx.createRadialGradient(pl.x - pl.r*.35, pl.y - pl.r*.35, 1, pl.x, pl.y, pl.r);
    gr.addColorStop(0, `hsl(${pl.hue},85%,78%)`); gr.addColorStop(1, `hsl(${pl.hue},70%,32%)`);
    ctx.fillStyle = gr; ctx.beginPath(); ctx.arc(pl.x, pl.y, pl.r, 0, 6.283); ctx.fill();
  }
  for (const w of wells){
    if (w.dead) continue;
    ctx.fillStyle = "#020306"; ctx.beginPath(); ctx.arc(w.x, w.y, 11, 0, 6.283); ctx.fill();
    ctx.strokeStyle = "hsla(285,90%,68%,.8)"; ctx.lineWidth = 2; ctx.setLineDash([6, 7]); ctx.lineDashOffset = -now / 40;
    ctx.beginPath(); ctx.arc(w.x, w.y, 17, 0, 6.283); ctx.stroke();
    ctx.strokeStyle = "hsla(285,90%,68%,.25)"; ctx.lineWidth = 1; ctx.lineDashOffset = now / 60;
    ctx.beginPath(); ctx.arc(w.x, w.y, 26, 0, 6.283); ctx.stroke(); ctx.setLineDash([]);
  }

  ctx.globalCompositeOperation = "lighter";
  for (const st of stars){
    if (st.got) continue;
    const t = now / 300;
    glow(st.x, st.y, 14 + Math.sin(t + st.y) * 2, "50,100%,60%", .55);
    ctx.fillStyle = "#FFE98A"; ctx.beginPath(); ctx.arc(st.x, st.y, 3.2, 0, 6.283); ctx.fill();
  }
  for (const it of items){
    if (it.got) continue;
    glow(it.x, it.y, 18 + Math.sin(now / 250) * 3, it.t === "S" ? "200,95%,60%" : it.t === "M" ? "320,95%,62%" : "30,95%,58%", .6);
  }
  for (let i = 0; i < trail.length; i++){
    const k = i / trail.length;
    glow(trail[i].x, trail[i].y, 3 + k * 7, `${ph0},95%,62%`, k * .5);
  }
  for (const p of parts) glow(p.x, p.y, 5, `${p.hue},95%,65%`, p.life * .8);
  glow(P.x, P.y, 20, `${ph0},95%,70%`, .8);
  ctx.globalCompositeOperation = "source-over";
  shape(ball, P.x, P.y, 4.8, now);
  if (P.shield){ ctx.strokeStyle = "hsla(200,95%,70%,.8)"; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(P.x, P.y, 13 + Math.sin(now / 150), 0, 6.283); ctx.stroke(); }
  ctx.font = "15px system-ui"; ctx.textAlign = "center"; ctx.textBaseline = "middle";
  for (const it of items) if (!it.got) ctx.fillText(it.t === "S" ? "🛡" : it.t === "M" ? "🧲" : "⏳", it.x, it.y + 1);
}

function frame(t){
  requestAnimationFrame(frame);
  const dt = Math.min(.033, (t - last) / 1000 || .016); last = t;
  if (running) update(dt);
  draw();
}
function end(msg){
  over = true; running = false;
  if (score > best){ best = score; $("hs").textContent = best; sv("orbitBest", best); }
  $("t").textContent = msg;
  $("t").style.direction = "rtl";
  $("p").textContent = "خاڵەکانت: " + score + (score >= best && score > 0 ? " — باشترین!" : "");
  $("go").textContent = "دووبارە";
  $("ov").style.display = "flex";
}
$("go").onclick = e => {
  e.stopPropagation(); unlock();
  reset(); over = false; running = true;
  $("ov").style.display = "none";
};
addEventListener("pointerdown", () => { if (running) release(); });
addEventListener("keydown", e => { if (e.code === "Space") { e.preventDefault(); if (running) release(); } });

drawPick(); drawSnd();
reset(); ready = true; requestAnimationFrame(t => { last = t; frame(t); });
</script>
</body>
